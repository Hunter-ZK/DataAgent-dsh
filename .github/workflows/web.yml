name: DataAgent Web Gate

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build
        working-directory: web
        run: npm run build
