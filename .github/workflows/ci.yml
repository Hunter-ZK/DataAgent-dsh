name: DataAgent V1 Gate

on:
  push:
    branches: [main, "migration/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]'
      - name: Compile
        run: python -m compileall -q src tests examples scripts
      - name: Architecture boundaries
        run: python scripts/check_architecture.py
      - name: Tests
        run: python -m pytest
      - name: Stage-0 evaluation smoke
        run: python examples/stage0_eval.py

  guard-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install guard dependencies from lockfile
        working-directory: guard-plugin
        run: npm ci --no-audit --no-fund
      - name: Build guard plugin
        working-directory: guard-plugin
        run: npm run build
      - name: Test guard policy
        working-directory: guard-plugin
        run: npm test

  dsh-runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dsh from lockfile
        working-directory: dsh
        run: npm ci --no-audit --no-fund
      - name: Verify dsh CLI
        working-directory: dsh
        run: |
          npm list @deepseek-ai/dsh
          npx dsh --version

  dsh-profile-integration:
    runs-on: ubuntu-24.04
    env:
      DSH_TELEMETRY_MODE: DISABLED
      DEEPSEEK_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm used by dsh plugin manager
        run: npm install --global pnpm@11.7.0
      - name: Bootstrap DataAgent profile through repository user path
        shell: pwsh
        run: |
          ./scripts/setup_dataagent.ps1 -DshHome "${{ runner.temp }}/dsh-home"
      - name: Re-run bootstrap to prove idempotence
        shell: pwsh
        run: |
          ./scripts/setup_dataagent.ps1 -DshHome "${{ runner.temp }}/dsh-home" -SkipDependencyInstall
      - name: Recover automatically from stale profile directory
        shell: pwsh
        run: |
          $staleHome = "${{ runner.temp }}/dsh-home-stale"
          $staleProfile = Join-Path $staleHome "profiles/dataagent"
          New-Item -ItemType Directory -Force -Path $staleProfile | Out-Null
          Set-Content -Path (Join-Path $staleProfile "leftover.txt") -Value "simulated interrupted bootstrap"
          ./scripts/setup_dataagent.ps1 -DshHome $staleHome -SkipDependencyInstall
          if (-not (Test-Path (Join-Path $staleProfile "package.json"))) {
            throw "stale profile recovery did not create a valid package.json"
          }
      - name: Verify repository query preset with dsh discovery
        working-directory: dsh
        run: |
          node --input-type=module <<'NODE'
          import { scanRoot } from '@deepseek-ai/dsh-agent-presets'
          import { resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'

          const presetRoot = resolve(process.cwd(), 'presets')
          const harnessBase = pathToFileURL(resolve(process.cwd(), 'node_modules', '@deepseek-ai', 'dsh-agent-presets') + '/')
          const presets = await scanRoot({ path: presetRoot, trust: 'system' }, harnessBase.href)
          const query = presets.find((item) => item.id === 'dataagent-query')
          if (!query) throw new Error('dataagent-query preset was not discovered')
          if (query.broken) throw new Error(`dataagent-query preset is broken: ${query.broken}`)
          console.log(JSON.stringify(query, null, 2))
          NODE
          if grep -Eq "@deepseek-ai/dsh-tool-(bash|pwsh|fs)|str-replace|plugin-manager" presets/dataagent-query/agent.cordis.yml; then
            echo "restricted dataagent-query preset exposes a forbidden developer tool" >&2
            exit 1
          fi
      - name: Validate composed DataAgent profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          set -o pipefail
          ./dsh/node_modules/.bin/dsh --profile dataagent --dump-config > "${RUNNER_TEMP}/dataagent-config.txt" 2> "${RUNNER_TEMP}/dataagent-config.err"
          cat "${RUNNER_TEMP}/dataagent-config.err"
          grep -q "agent3-guard" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "mcp-agent3" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "session-log-deepseek" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "disabled: true" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "deepseek-official" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "deepseek-flash" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "DEEPSEEK_API_KEY" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "dataagent-query" "${RUNNER_TEMP}/dataagent-config.txt"
          grep -q "./dsh/presets" "${RUNNER_TEMP}/dataagent-config.txt"
          if grep -Eq "127\.0\.0\.1:8100|deepseek-v3-local|LOCAL_LLM_KEY" "${RUNNER_TEMP}/dataagent-config.txt"; then
            echo "DataAgent profile still contains retired local-LLM configuration" >&2
            exit 1
          fi
          if grep -Eqi "unmatched|not found|failed to resolve|profile .* does not exist" "${RUNNER_TEMP}/dataagent-config.err"; then
            echo "DataAgent profile contains unresolved patch targets or bootstrap failure" >&2
            exit 1
          fi
