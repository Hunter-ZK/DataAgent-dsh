name: DataAgent V1 Gate

on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  python-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]'
      - name: Compile
        run: python -m compileall -q src tests examples scripts
      - name: Architecture boundaries
        run: python scripts/check_architecture.py
      - name: Tests
        run: python -m pytest
      - name: Stage-0 evaluation smoke
        run: python examples/stage0_eval.py

  guard-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install guard dependencies
        working-directory: guard-plugin
        run: npm install --no-audit --no-fund
      - name: Build guard plugin
        working-directory: guard-plugin
        run: npm run build
      - name: Test guard policy
        working-directory: guard-plugin
        run: npm test

  dsh-runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dsh
        working-directory: dsh
        run: npm install --no-audit --no-fund
      - name: Verify dsh CLI
        working-directory: dsh
        run: |
          npm list @deepseek-ai/dsh
          npx dsh --version

  freeze-lockfiles:
    if: github.ref == 'refs/heads/migration/v1-dsh'
    needs: [guard-plugin, dsh-runtime-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/v1-dsh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exact dependency lockfiles
        run: |
          (cd guard-plugin && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd dsh && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guard-plugin/package-lock.json dsh/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already frozen"
          else
            git commit -m "build: freeze Node dependency lockfiles"
            git push origin HEAD:migration/v1-dsh
          fi
