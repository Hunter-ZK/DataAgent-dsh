# DataAgent dsh profile for @deepseek-ai/dsh 0.1.6-alpha.2.
# Existing rows are patched directly by id; only new rows use `insert`.
# Run dsh from the repository root so ./dsh/presets resolves deterministically.
# The custom `dataagent` profile itself must first be initialized under DSH_HOME;
# use scripts/setup_dataagent.ps1 rather than launching a missing profile directly.

# Disable public egress surfaces that are unrelated to model inference.
# DeepSeek official model inference remains enabled through the native
# @deepseek-ai/dsh-llm-deepseek adapter.
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true

# Use DeepSeek's official API from the locally running Harness.
# The API key is resolved per request from DEEPSEEK_API_KEY (or the Harness
# credential store if configured through the Web Models settings page).
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# Agent3 MCP is an adapter; business logic remains in Python Core.
- insert:
    - id: mcp-agent3
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agent3
        transport: streamable-http
        url: http://127.0.0.1:8900/mcp
        toolCallTimeoutMs: 120000
        failOnStartupError: true
        reconnect:
          enabled: true
          maxAttempts: 20

# agent3-guard is intentionally NOT inserted here. Installing the local
# @hunter-zk/agent3-guard bundle adds its own row from guard-plugin/cordis.patch.yml.

# In dsh 0.1.6-alpha.2 the @deepseek-ai/dsh-permission-presets row id is `permission`.
- id: permission
  config:
    defaultPreset: analyst
    presets:
      analyst:
        sandbox: read-only
        approval: ask
        name: 分析师
      engineer:
        sandbox: workspace-write
        approval: ask
        name: 数据工程师

# V1 business-query sessions use only the repository-owned restricted preset.
- id: agent-presets
  config:
    default: dataagent-query
    roots:
      - path: ./dsh/presets
        trust: system
    includeShippedRoot: false
    includeUserRoot: false
